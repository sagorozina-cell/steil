<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlyphCraft — Stylish Name & Unicode Symbol Generator</title>
    <meta name="description" content="Generate your stylish name now. 14000+ unicode font symbols generator for PUBG, Free Fire, Kaomoji, cool fonts, bios text online for Free!" />
    <meta name="keywords" content="stylish name, fancy text generator, unicode symbols, free fire name, pubg nickname, kaomoji, zalgo text, bangla stylish name, copy paste font" />
    <meta property="og:title" content="GlyphCraft — Stylish Name & Unicode Symbol Generator" />
    <meta property="og:description" content="Generate 200+ unique stylish names, bio fonts, gaming nicknames, and browse 14,000+ Unicode symbols with 1-click instant copy." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="canonical" href="/" />

    <!-- Error handler for external third-party script noise -->
    <script>
      window.addEventListener('error', function(event) {
        if (event.message === 'Script error.' || (event.filename && event.filename.indexOf('translate.google') !== -1)) {
          event.preventDefault();
          return true;
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (event.reason.message === 'Script error.' || String(event.reason).indexOf('translate') !== -1)) {
          event.preventDefault();
        }
      });
    </script>

    <!-- Google Fonts: Multilingual Typography (Outfit, Space Grotesk, Noto Sans suite for Bengali, Devanagari, Arabic, JP, KR, Thai, Cyrillic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- JSON-LD Structured Data: WebApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "GlyphCraft",
      "url": "https://glyphcraft.app",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "All",
      "description": "Transform ordinary names and text into stylish Unicode fonts, gaming nicknames, kaomoji, and decorative plain-text symbols.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
  </head>
  <body class="bg-white text-slate-900 antialiased selection:bg-cyan-100 selection:text-cyan-900">
    <div id="root"></div>
    <!-- Hidden Google Translate Container -->
    <div id="google_translate_element" style="display: none; visibility: hidden; position: absolute; left: -9999px;"></div>
    <script type="text/javascript">
      // 1. Instantly restore saved translation before Google script loads
      (function() {
        try {
          var savedGoogleLang = localStorage.getItem('glyphcraft_user_lang');
          if (savedGoogleLang && savedGoogleLang !== 'en') {
            var transPath = '/en/' + savedGoogleLang;
            document.cookie = 'googtrans=' + transPath + '; path=/;';
            document.cookie = 'googtrans=' + transPath + '; domain=' + window.location.hostname + '; path=/;';
            var hostParts = window.location.hostname.split('.');
            if (hostParts.length > 2) {
              document.cookie = 'googtrans=' + transPath + '; domain=.' + hostParts.slice(-2).join('.') + '; path=/;';
            }
          }
        } catch(e) {}

        // 2. Prevent Google Translate from adding margin/top or covering header
        var preventHeaderCover = function() {
          try {
            if (document.body && document.body.style && document.body.style.top && document.body.style.top !== '0px') {
              document.body.style.top = '0px';
            }
            if (document.documentElement && document.documentElement.style && document.documentElement.style.top && document.documentElement.style.top !== '0px') {
              document.documentElement.style.top = '0px';
            }
            var frames = document.querySelectorAll('.goog-te-banner-frame, iframe.goog-te-banner-frame, .VIpgJd-ZVi9od-ORHb-OEVmcb');
            if (frames && frames.length) {
              frames.forEach(function(el) {
                if (el && el.style) {
                  el.style.display = 'none';
                  el.style.visibility = 'hidden';
                  el.style.height = '0';
                }
              });
            }
          } catch(e) {}
        };
        setInterval(preventHeaderCover, 500);
      })();

      window.googleTranslateElementInit = function() {
        try {
          if (window.google && window.google.translate && window.google.translate.TranslateElement) {
            new window.google.translate.TranslateElement({
              pageLanguage: 'en',
              includedLanguages: 'en,bn,hi,ar,ja,ko,fr,es,ru,de,id,tr,pt,th,it,ur,ta,te,zh-CN',
              autoDisplay: false
            }, 'google_translate_element');
          }
        } catch(e) {}
      };
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" async onerror="console.warn('Translate service deferred')"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
